<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Map </title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet Routing Machine CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    
    <!-- SF Pro / Inter Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #000;
            color: #f5f5f7;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Apple Maps Floating Glass UI Overlay */
        .floating-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 400px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
        }

        .glass-card {
            background: rgba(28, 28, 30, 0.8);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            padding: 18px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            pointer-events: auto;
        }

        .glass-card h2 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 14px;
            color: #fff;
        }

        /* Input Group Fields */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 14px;
        }

        .input-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 10px 14px;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .input-box input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            width: 100%;
        }

        .input-box input::placeholder {
            color: #8e8e93;
        }

        /* Transport Mode Segmented Control */
        .mode-selector {
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            padding: 3px;
            gap: 4px;
            margin-bottom: 16px;
        }

        .mode-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #8e8e93;
            padding: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .nav-go-btn {
            background: #0a84ff;
            color: #fff;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .nav-go-btn:hover {
            background: #0071e3;
        }

        /* Live HUD Card */
        .hud-card {
            background: rgba(28, 28, 30, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            pointer-events: auto;
            display: none; 
        }

        .hud-icon {
            font-size: 1.8rem;
        }

        .hud-text h4 {
            font-size: 0.85rem;
            color: #8e8e93;
            font-weight: 500;
        }

        .hud-text p {
            font-size: 1.05rem;
            font-weight: 600;
            color: #fff;
        }

        .leaflet-routing-container {
            display: none !important;
        }

        @media (max-width: 600px) {
            .floating-ui {
                width: calc(100% - 32px);
                left: 16px;
                top: 16px;
            }
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Apple Maps Glass UI Overlay -->
    <div class="floating-ui">
        <div class="glass-card">
            <h2>Plan Your Route</h2>
            
            <div class="input-group">
                <!-- Visitor Origin Address Input -->
                <div class="input-box">
                    <span>🟢</span>
                    <input type="text" id="startAddressInput" placeholder="Enter starting address (e.g. Ikeja, Lagos)" value="Ikeja, Lagos">
                </div>
                <!-- Visitor Destination Address Input -->
                <div class="input-box">
                    <span>🏁</span>
                    <input type="text" id="endAddressInput" placeholder="Enter destination (e.g. Lekki, Lagos)" value="Lekki Phase 1, Lagos">
                </div>
            </div>

            <div class="mode-selector">
                <button class="mode-btn active" onclick="setTravelMode('driving', this)">🚗 Drive</button>
                <button class="mode-btn" onclick="setTravelMode('foot', this)">🚶 Walk</button>
                <button class="mode-btn" onclick="setTravelMode('transit', this)">🚌 Transit</button>
            </div>

            <button class="nav-go-btn" onclick="processUserAddresses()">Route & Speak</button>
        </div>

        <div class="hud-card" id="hudCard">
            <div class="hud-icon">🧭</div>
            <div class="hud-text">
                <h4 id="hudDistance">Calculating...</h4>
                <p id="hudInstruction">Preparing directions...</p>
            </div>
        </div>
    </div>

    <!-- Leaflet & Routing JS Libraries -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

    <script>
        // 1. Initialize Map
        var map = L.map('map', {
            zoomControl: false,
            attributionControl: false
        }).setView([6.5244, 3.3792], 12);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            subdomains: 'abcd'
        }).addTo(map);

        let currentProfile = 'driving';
        let routingControl = null;

        function setTravelMode(mode, btnElement) {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            currentProfile = mode;
        }

        // 2. Female Voice Engine that reads out the custom addresses
        function speakText(message) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(message);
                utterance.rate = 1.0;
                utterance.pitch = 1.05;

                let voices = window.speechSynthesis.getVoices();
                for (let v of voices) {
                    if (v.name.includes('Female') || v.name.includes('Zira') || v.name.includes('Samantha') || v.name.includes('Victoria')) {
                        utterance.voice = v;
                        break;
                    }
                }
                window.speechSynthesis.speak(utterance);
            }
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }

        // 3. Convert text address to Lat/Lng coordinates using Nominatim API (Free OpenStreetMap Geocoder)
        async function geocodeAddress(addressQuery) {
            let url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(addressQuery)}`;
            try {
                let response = await fetch(url);
                let data = await response.json();
                if (data && data.length > 0) {
                    return L.latLng(parseFloat(data[0].lat), parseFloat(data[0].lon));
                } else {
                    alert(`Could not find address: "${addressQuery}". Please try a more specific location.`);
                    return null;
                }
            } catch (error) {
                console.error("Geocoding error:", error);
                return null;
            }
        }

        // 4. Process custom visitor inputs, fetch map pins, speak visitor addresses, and route
        async function processUserAddresses() {
            let startText = document.getElementById('startAddressInput').value;
            let endText = document.getElementById('endAddressInput').value;

            if (!startText || !endText) {
                alert("Please fill in both starting and destination addresses!");
                return;
            }

            document.getElementById('hudCard').style.display = 'flex';
            document.getElementById('hudDistance').innerText = "Locating addresses...";
            document.getElementById('hudInstruction').innerText = "Please wait while we search...";

            // Speak back the addresses the visitor entered
            speakText(`Routing from ${startText} to ${endText}. Finding your path now.`);

            // Fetch coordinates for both inputs simultaneously
            let startLatLng = await geocodeAddress(startText);
            let endLatLng = await geocodeAddress(endText);

            if (!startLatLng || !endLatLng) return;

            // Remove existing path if present
            if (routingControl) {
                map.removeControl(routingControl);
            }

            // Draw route between custom visitor addresses
            routingControl = L.Routing.control({
                waypoints: [startLatLng, endLatLng],
                router: L.Routing.osrmv1({
                    serviceUrl: 'https://router.project-osrm.org/route/v1',
                    profile: currentProfile
                }),
                lineOptions: {
                    styles: [{ color: '#0a84ff', opacity: 0.85, weight: 6 }]
                },
                show: false,
                addWaypoints: false,
                fitSelectedRoutes: true,
                createMarker: function(i, wp, nWps) {
                    let pinColor = (i === 0) ? '#30d158' : '#ff453a';
                    let label = (i === 0) ? `Start: ${startText}` : `Destination: ${endText}`;
                    return L.circleMarker(wp.latLng, {
                        radius: 9,
                        color: '#fff',
                        weight: 2,
                        fillColor: pinColor,
                        fillOpacity: 1
                    }).bindPopup(label);
                }
            }).addTo(map);

            routingControl.on('routesfound', function(e) {
                let firstStep = e.routes[0].instructions[0];
                let textInstruction = firstStep.text;
                let distanceText = firstStep.distance > 1000 ? (firstStep.distance / 1000).toFixed(1) + ' km' : firstStep.distance + ' meters';

                document.getElementById('hudDistance').innerText = `In ${distanceText}`;
                document.getElementById('hudInstruction').innerText = textInstruction;
                
                // Speak the first immediate turn instruction
                speakText(`In ${distanceText}, ${textInstruction}`);
            });
        }
    </script>
</body>
</html>
