<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Interactive Map with Voice Navigation</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar UI */
        .sidebar {
            width: 380px;
            background: #1e293b;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            padding: 24px;
            z-index: 1000;
            box-shadow: 4px 0 24px rgba(0,0,0,0.3);
        }

        .sidebar h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #38bdf8;
        }

        .sidebar p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        /* Direction Card with Image */
        .direction-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .direction-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .direction-img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid #38bdf8;
        }

        .direction-info h3 {
            font-size: 1rem;
            font-weight: 600;
            color: #f8fafc;
        }

        .direction-info span {
            font-size: 0.8rem;
            color: #38bdf8;
        }

        .action-btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            margin-bottom: 8px;
        }

        .action-btn:hover {
            background: #0ea5e9;
        }

        .secondary-btn {
            background: #334155;
            color: #f8fafc;
        }

        .secondary-btn:hover {
            background: #475569;
        }

        /* Map Container */
        #map {
            flex-grow: 1;
            height: 100%;
            background: #0f172a;
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: 45vh; overflow-y: auto; }
            #map { height: 55vh; }
        }
    </style>
</head>
<body>

    <!-- Sidebar Control Panel -->
    <div class="sidebar">
        <h1>GeoNav Voice Pro</h1>
        <p>Interactive web map powered by HTML, CSS, Leaflet, and Web Speech API.</p>

        <!-- Direction Box with mini picture -->
        <div class="direction-card">
            <div class="direction-header">
                <img src="https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?w=150" alt="Route preview" class="direction-img">
                <div class="direction-info">
                    <h3>HQ Destination</h3>
                    <span>Voice Navigation Ready</span>
                </div>
            </div>
            <button class="action-btn" onclick="triggerNavigation('nav')">Start Navigation</button>
            <button class="action-btn secondary-btn" onclick="triggerNavigation('uturn')">Simulate U-Turn</button>
        </div>

        <div style="margin-top: auto; font-size: 0.75rem; color: #64748b; text-align: center;">
            Voice synthesis active via browser engine
        </div>
    </div>

    <!-- The Map Element -->
    <div id="map"></div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Initialize the map
        var map = L.map('map', {
            zoomControl: false
        }).setView([6.5244, 3.3792], 13);

        L.control.zoom({ position: 'topright' }).addTo(map);

        // 2. Add CartoDB Dark Matter map skin
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap & CARTO',
            subdomains: 'abcd'
        }).addTo(map);

        // 3. Add marker
        var targetLatLng = [6.5244, 3.3792];
        var marker = L.marker(targetLatLng).addTo(map);
        marker.bindPopup("<b>HQ Destination</b>").openPopup();

        // 4. Text-to-Speech Engine (The Woman Voice feature)
        function speakDirections(textToSpeak) {
            if ('speechSynthesis' in window) {
                // Cancel any ongoing speech so they don't stack up
                window.speechSynthesis.cancel();

                var utterance = new SpeechSynthesisUtterance(textToSpeak);
                utterance.rate = 1.0; // Normal speed
                utterance.pitch = 1.1; // Slightly higher pitch for clear voice

                // Try to find a natural female voice available on your system/device
                var voices = window.speechSynthesis.getVoices();
                for (var i = 0; i < voices.length; i++) {
                    if (voices[i].name.includes('Female') || voices[i].name.includes('Zira') || voices[i].name.includes('Samantha') || voices[i].name.includes('Victoria')) {
                        utterance.voice = voices[i];
                        break;
                    }
                }

                window.speechSynthesis.speak(utterance);
            } else {
                console.log("Text-to-speech not supported in this browser.");
            }
        }

        // Fix for Chrome's voice loading quirk
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = function() {
                window.speechSynthesis.getVoices();
            };
        }

        // 5. Button Actions that combine map movement + spoken voice cues
        function triggerNavigation(actionType) {
            if (actionType === 'nav') {
                map.flyTo(targetLatLng, 16, { duration: 1.5 });
                marker.openPopup();
                speakDirections("Route loaded. Head north on the main avenue, then prepare to turn right.");
            } else if (actionType === 'uturn') {
                // Shift map slightly to simulate movement context
                map.panBy([50, -50], { animate: true });
                speakDirections("In 200 meters, make a U-turn when safe.");
            }
        }
    </script>

</body>
</html>
