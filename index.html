<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My free Map</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- SF Pro / Inter Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #000;
            color: #f5f5f7;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Apple Maps Floating Glass UI Overlay */
        .floating-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 400px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
        }

        .glass-card {
            background: rgba(28, 28, 30, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            padding: 18px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            pointer-events: auto;
        }

        .glass-card h2 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 14px;
            color: #fff;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 14px;
        }

        .input-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 10px 14px;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .input-box input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            width: 100%;
        }

        .input-box input::placeholder {
            color: #8e8e93;
        }

        .gps-btn {
            background: rgba(10, 132, 255, 0.2);
            border: 1px solid #0a84ff;
            color: #38bdf8;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .gps-btn:hover {
            background: rgba(10, 132, 255, 0.4);
        }

        .mode-selector {
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            padding: 3px;
            gap: 4px;
            margin-bottom: 16px;
        }

        .mode-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #8e8e93;
            padding: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .nav-go-btn {
            background: #0a84ff;
            color: #fff;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .nav-go-btn:hover {
            background: #0071e3;
        }

        /* Live HUD Card */
        .hud-card {
            background: rgba(28, 28, 30, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            pointer-events: auto;
            display: none; 
        }

        .hud-icon {
            font-size: 1.8rem;
        }

        .hud-text h4 {
            font-size: 0.85rem;
            color: #8e8e93;
            font-weight: 500;
        }

        .hud-text p {
            font-size: 1.05rem;
            font-weight: 600;
            color: #fff;
        }

        @media (max-width: 600px) {
            .floating-ui {
                width: calc(100% - 32px);
                left: 16px;
                top: 16px;
            }
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Apple Maps Glass UI Overlay -->
    <div class="floating-ui">
        <div class="glass-card">
            <h2>Live Navigation</h2>
            
            <div class="input-group">
                <div class="input-box">
                    <span>🟢</span>
                    <input type="text" id="startAddressInput" placeholder="Your starting address or GPS">
                    <button class="gps-btn" onclick="requestUserLocation()">📍 Use GPS</button>
                </div>
                <div class="input-box">
                    <span>🏁</span>
                    <input type="text" id="endAddressInput" placeholder="Enter destination address">
                </div>
            </div>

            <div class="mode-selector">
                <button class="mode-btn active" onclick="setTravelMode('driving', this)">🚗 Drive</button>
                <button class="mode-btn" onclick="setTravelMode('foot', this)">🚶 Walk</button>
            </div>

            <button class="nav-go-btn" onclick="calculateRoute()">Route & Speak</button>
        </div>

        <div class="hud-card" id="hudCard">
            <div class="hud-icon">🧭</div>
            <div class="hud-text">
                <h4 id="hudDistance">Ready</h4>
                <p id="hudInstruction">Enter your addresses to begin</p>
            </div>
        </div>
    </div>

    <!-- Leaflet JS Library -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Initialize Map
        var map = L.map('map', {
            zoomControl: false,
            attributionControl: false
        }).setView([6.5244, 3.3792], 12);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            subdomains: 'abcd'
        }).addTo(map);

        let currentProfile = 'driving';
        let verifiedStartLatLng = null;
        let currentRouteLayer = null;
        let currentMarkers = [];

        function setTravelMode(mode, btnElement) {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            currentProfile = mode;
        }

        // 2. Female Voice Engine
        function speakText(message) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(message);
                utterance.rate = 1.0;
                utterance.pitch = 1.05;

                let voices = window.speechSynthesis.getVoices();
                for (let v of voices) {
                    if (v.name.includes('Female') || v.name.includes('Zira') || v.name.includes('Samantha') || v.name.includes('Victoria')) {
                        utterance.voice = v;
                        break;
                    }
                }
                window.speechSynthesis.speak(utterance);
            }
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }

        // 3. Request Live GPS Geolocation
        function requestUserLocation() {
            if (!navigator.geolocation) {
                alert("Geolocation is not supported by your browser");
                return;
            }

            document.getElementById('hudCard').style.display = 'flex';
            document.getElementById('hudDistance').innerText = "Requesting permission...";
            document.getElementById('hudInstruction').innerText = "Please allow location access on your device.";
            speakText("Please allow location access on your device.");

            navigator.geolocation.getCurrentPosition(
                async function(position) {
                    let lat = position.coords.latitude;
                    let lon = position.coords.longitude;
                    verifiedStartLatLng = L.latLng(lat, lon);

                    map.setView(verifiedStartLatLng, 15);

                    let reverseUrl = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`;
                    try {
                        let res = await fetch(reverseUrl);
                        let data = await res.json();
                        let addressName = data.display_name ? data.display_name.split(',')[0] + ', ' + (data.display_name.split(',')[1] || '') : "Current Location";
                        
                        document.getElementById('startAddressInput').value = addressName;
                        document.getElementById('hudDistance').innerText = "Location acquired";
                        document.getElementById('hudInstruction').innerText = "Ready to route from your position.";
                        speakText("Location acquired successfully. Enter your destination.");
                    } catch (err) {
                        document.getElementById('startAddressInput').value = "My GPS Location";
                        speakText("Location acquired.");
                    }
                },
                function(error) {
                    alert("Location access denied or unavailable. Type your starting address manually.");
                    document.getElementById('hudCard').style.display = 'none';
                },
                { enableHighAccuracy: true }
            );
        }

        // Geocode text query
        async function geocodeAddress(addressQuery) {
            let url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(addressQuery)}`;
            try {
                let response = await fetch(url);
                let data = await response.json();
                if (data && data.length > 0) {
                    return L.latLng(parseFloat(data[0].lat), parseFloat(data[0].lon));
                } else {
                    alert(`Could not find address: "${addressQuery}"`);
                    return null;
                }
            } catch (error) {
                return null;
            }
        }

        // 4. Calculate Route using OpenStreetMap API directly (No plugin, No API Keys)
        async function calculateRoute() {
            let startText = document.getElementById('startAddressInput').value;
            let endText = document.getElementById('endAddressInput').value;

            if (!endText) {
                alert("Please enter your destination address!");
                return;
            }

            document.getElementById('hudCard').style.display = 'flex';
            document.getElementById('hudDistance').innerText = "Calculating...";
            document.getElementById('hudInstruction').innerText = "Finding the best path...";

            let startLatLng = verifiedStartLatLng;
            if (!startLatLng) {
                if (!startText) {
                    alert("Please provide a starting address or click 'Use GPS'");
                    return;
                }
                startLatLng = await geocodeAddress(startText);
            }

            let endLatLng = await geocodeAddress(endText);
            if (!startLatLng || !endLatLng) return;

            speakText(`Routing from ${startText || 'your location'} to ${endText}. Finding your path.`);

            // Clear old routes and markers
            if (currentRouteLayer) map.removeLayer(currentRouteLayer);
            currentMarkers.forEach(m => map.removeLayer(m));
            currentMarkers = [];

            // Fetch route from public OSRM server
            let osrmUrl = `https://router.project-osrm.org/route/v1/${currentProfile}/${startLatLng.lng},${startLatLng.lat};${endLatLng.lng},${endLatLng.lat}?overview=full&geometries=geojson&steps=true`;

            try {
                let response = await fetch(osrmUrl);
                let data = await response.json();

                if (data.code !== 'Ok' || !data.routes || data.routes.length === 0) {
                    alert("Could not calculate a route between these locations.");
                    return;
                }

                let route = data.routes[0];
                let coords = route.geometry.coordinates.map(c => [c[1], c[0]]); // Flip to Leaflet format [lat, lng]

                // Draw gorgeous Apple-style blue line on map
                currentRouteLayer = L.polyline(coords, {
                    color: '#0a84ff',
                    weight: 6,
                    opacity: 0.9,
                    lineCap: 'round'
                }).addTo(map);

                map.fitBounds(currentRouteLayer.getBounds(), { padding: [50, 50] });

                // Add Start and End Pins
                let startMarker = L.circleMarker(startLatLng, { radius: 9, color: '#fff', weight: 2, fillColor: '#30d158', fillOpacity: 1 }).addTo(map).bindPopup("Start: " + (startText || "GPS Location"));
                let endMarker = L.circleMarker(endLatLng, { radius: 9, color: '#fff', weight: 2, fillColor: '#ff453a', fillOpacity: 1 }).addTo(map).bindPopup("Destination: " + endText);
                currentMarkers.push(startMarker, endMarker);

                // Read first instruction via voice
                if (route.legs && route.legs[0].steps && route.legs[0].steps.length > 0) {
                    let firstStep = route.legs[0].steps[0];
                    let distanceText = firstStep.distance > 1000 ? (firstStep.distance / 1000).toFixed(1) + ' km' : Math.round(firstStep.distance) + ' meters';
                    
                    document.getElementById('hudDistance').innerText = `In ${distanceText}`;
                    document.getElementById('hudInstruction').innerText = firstStep.maneuver.instruction || "Proceed on route";

                    speakText(`In ${distanceText}, ${firstStep.maneuver.instruction || "head towards your destination"}`);
                }

            } catch (err) {
                console.error(err);
                alert("Network error while calculating route.");
            }
        }
    </script>
</body>
</html>
